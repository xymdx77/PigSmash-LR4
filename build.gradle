plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pigsmash" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}

// --- БЛОК ДЛЯ ЗАДАЧИ PRODCLIENT (StoneBros) ---
// Используем встроенный механизм Loom для запуска в производственном режиме
tasks.register('prodClient', JavaExec) {
	group = 'fabric'
	description = 'Runs the client in production mode'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.fabricmc.devlaunchinjector.Main'

	// Явно указываем, что это клиент
	systemProperty 'fabric.dli.main', 'net.fabricmc.loader.impl.launch.knot.KnotClient'
	systemProperty 'fabric.dli.env', 'client'

	// Автоматически подставляем путь к игре из Loom
	systemProperty 'fabric.gameJar', tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath
}
